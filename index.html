<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickInvoice - Free Invoice Maker</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:white;margin:0;padding:20px}
.wrap{max-width:800px;margin:auto}
h1{font-size:28px;margin-bottom:5px}
p.sub{color:#94a3b8;margin-top:0}
.card{background:white;color:#111;border-radius:16px;padding:20px;margin-top:20px}
label{font-size:13px;font-weight:bold;color:#475569}
input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0 14px;font-size:15px}
.row{display:flex;gap:10px}.row>div{flex:1}
table{width:100%;border-collapse:collapse;margin-top:10px}
th{font-size:12px;text-align:left;color:#64748b;padding:8px 0;border-bottom:2px solid #f1f5f9}
td{padding:8px 0;border-bottom:1px solid #f1f5f9}
td input{margin:0;padding:10px}
.total{text-align:right;font-size:22px;font-weight:bold;margin-top:15px}
.btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
button{border:0;padding:14px 20px;border-radius:12px;font-weight:bold;cursor:pointer;font-size:15px}
.primary{background:#2563eb;color:white;flex:1}
.green{background:#16a34a;color:white;flex:1}
.ghost{background:#f1f5f9;color:#111}
#preview{background:white;color:#111;border-radius:16px;padding:25px;margin-top:20px;display:none}
@media print{body{background:white}.no-print{display:none}#preview{display:block !important}}
</style>
</head>
<body>
<div class="wrap">
<h1>🧾 QuickInvoice</h1>
<p class="sub">Create a beautiful invoice in 30 seconds. No login. Free.</p>
<div class="card no-print">
<div class="row"><div><label>Your Business Name</label><input id="biz" placeholder="e.g. John Designs" oninput="update()"></div><div><label>Client Name</label><input id="client" placeholder="e.g. Acme Ltd" oninput="update()"></div></div>
<label>Invoice Number</label><input id="invNo" value="INV-001" oninput="update()">
<table><tr><th>Item</th><th>Qty</th><th>Price ($)</th><th></th></tr><tbody id="items">
<tr><td><input value="Website Design" oninput="calc()"></td><td><input type="number" value="1" oninput="calc()"></td><td><input type="number" value="100" oninput="calc()"></td><td><button class="ghost" onclick="this.parentElement.parentElement.remove();calc()">✕</button></td></tr>
<tr><td><input value="Logo" oninput="calc()"></td><td><input type="number" value="1" oninput="calc()"></td><td><input type="number" value="50" oninput="calc()"></td><td><button class="ghost" onclick="this.parentElement.parentElement.remove();calc()">✕</button></td></tr>
</tbody></table>
<button class="ghost" onclick="addRow()">+ Add Item</button>
<div class="total">Total: $<span id="total">150</span></div>
<div class="btns"><button class="primary" onclick="showPreview()">👀 Preview Invoice</button><button class="green" onclick="shareLink()">🔗 Copy Share Link</button></div>
</div>
<div id="preview"></div>
<div class="btns no-print" id="printBtn" style="display:none"><button class="primary" onclick="window.print()" style="flex:1">⬇ Download as PDF</button></div>
</div>
<script>
function addRow(){document.getElementById('items').insertAdjacentHTML('beforeend','<tr><td><input placeholder="Item" oninput="calc()"></td><td><input type="number" value="1" oninput="calc()"></td><td><input type="number" value="0" oninput="calc()"></td><td><button class="ghost" onclick="this.parentElement.parentElement.remove();calc()">✕</button></td></tr>');calc();}
function calc(){let total=0,rows='';document.querySelectorAll('#items tr').forEach(tr=>{let i=tr.querySelectorAll('input');let n=i[0].value||'Item';let q=parseFloat(i[1].value)||0;let p=parseFloat(i[2].value)||0;total+=q*p;rows+='<tr><td>'+n+'</td><td>'+q+'</td><td>$'+p+'</td><td style="text-align:right">$'+(q*p)+'</td></tr>';});document.getElementById('total').innerText=total;window._rows=rows;window._total=total;update();}
function update(){let b=document.getElementById('biz').value||'Your Business';let c=document.getElementById('client').value||'Client Name';let v=document.getElementById('invNo').value||'INV-001';if(document.getElementById('preview').style.display==='block')showPreview();window._biz=b;window._client=c;window._inv=v;}
function showPreview(){calc();document.getElementById('preview').style.display='block';document.getElementById('printBtn').style.display='flex';document.getElementById('preview').innerHTML='<div style="display:flex;justify-content:space-between"><h2 style="margin:0">'+window._biz+'</h2><span style="background:#eff6ff;color:#2563eb;padding:6px 12px;border-radius:20px;font-weight:bold">'+window._inv+'</span></div><p style="color:#64748b">Billed To: <b style="color:#111">'+window._client+'</b> • Date: '+new Date().toDateString()+'</p><table style="width:100%"><tr><th>Item</th><th>Qty</th><th>Price</th><th style="text-align:right">Amount</th></tr>'+window._rows+'</table><div style="text-align:right;font-size:24px;font-weight:bold;margin-top:15px">Total: $'+window._total+'</div><p style="color:#64748b;font-size:13px;margin-top:20px">Made with QuickInvoice - Free, No Login</p>';document.getElementById('preview').scrollIntoView({behavior:'smooth'});}
function shareLink(){navigator.clipboard.writeText(location.href).then(()=>alert('Link copied! Send it to anyone on WhatsApp.'));}
calc();
</script>
</body>
</html>
